plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

repositories { mavenCentral() }

def git = { String... arguments ->
    providers.exec {
        workingDir rootDir
        commandLine(['git', '--no-optional-locks'] + arguments.toList())
    }.standardOutput.asText.get().trim()
}
def versionTag = /v[0-9]+\.[0-9]+\.[0-9]+/
def releaseTag = providers.gradleProperty('releaseTag').orNull
def commit = file('.git').exists() ? git('rev-parse', 'HEAD') : null
def resolveVersion = {
    if (!commit && releaseTag == null) {
        return '0.0.0-dev'
    }
    def dirty = commit && git('status', '--porcelain=v1', '--untracked-files=normal')
    if (releaseTag != null) {
        if (!(releaseTag ==~ versionTag) || !commit || dirty ||
                git('tag', '--points-at', 'HEAD', '--list', releaseTag) != releaseTag) {
            throw new GradleException("Release tag '${releaseTag}' must be a vMAJOR.MINOR.PATCH tag on a clean HEAD")
        }
        return releaseTag.substring(1)
    }

    def tags = git('tag', '--merged', 'HEAD', '--list').readLines().findAll { it ==~ versionTag }
    def baseVersion = '0.0.0'
    def revisions
    def shortCommit
    if (tags) {
        def matches = tags.collectMany { ['--match', it] }
        def (tag, distance, hash) = git('describe', '--tags', '--long', '--abbrev=12', *matches, 'HEAD').split('-')
        baseVersion = tag.substring(1)
        if (distance == '0' && !dirty) {
            return baseVersion
        }
        revisions = distance
        shortCommit = hash
    } else {
        revisions = git('rev-list', '--count', 'HEAD')
        shortCommit = 'g' + git('rev-parse', '--short=12', 'HEAD')
    }

    def branch = git('rev-parse', '--abbrev-ref', 'HEAD')
    def branchLabel = branch == 'HEAD' ? 'detached' : branch.replaceAll(/[^0-9A-Za-z-]+/, '-').take(64)
    return "${baseVersion}-dev.${revisions}.${branchLabel}.${shortCommit}${dirty ? '.dirty' : ''}"
}
def modVersion = resolveVersion()
version = modVersion
group = 'org.ja4.trainmod'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = '26.3.0.115'
    runs {
        client {
            client()
            environment 'ALSOFT_DRIVERS', 'pulse'
            if (providers.gradleProperty('clientAuth').isPresent()) {
                devLogin = true
            } else {
                programArguments.addAll '--username', 'jrddunbr'
            }
            if (providers.gradleProperty('clientAdditionsSmoke').isPresent()) {
                gameDirectory = project.file('run/client-additions-smoke')
                systemProperty 'trainmod.clientAdditionsSmoke', providers.gradleProperty('clientAdditionsSmoke').get()
                programArguments.addAll '--quickPlaySingleplayer', 'Trainmod Additions'
            }
            if (providers.gradleProperty('clientSmoke').isPresent()) {
                gameDirectory = project.file('run/client-smoke')
                systemProperty 'trainmod.clientSmoke', 'true'
                programArguments.addAll '--quickPlaySingleplayer', 'Trainmod Smoke'
            }
        }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            programArguments.addAll '--tests', 'trainmod:*'
            gameDirectory = project.file('run/game-test')
        }
    }
    mods {
        trainmod {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.13.4'
}
tasks.named('test') { useJUnitPlatform() }

sourceSets {
    test {
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.compileClasspath
    }
    gameTest {
        compileClasspath += main.output.classesDirs + main.compileClasspath
        runtimeClasspath += main.output.classesDirs + main.compileClasspath
    }
    assetGen {
        compileClasspath += main.output.classesDirs + main.compileClasspath
        runtimeClasspath += main.output.classesDirs + main.compileClasspath
    }
}

def generateAssets = tasks.register('generateTrainAssets', JavaExec) {
    dependsOn tasks.named('compileAssetGenJava')
    classpath = sourceSets.assetGen.runtimeClasspath
    mainClass = 'org.ja4.trainmod.TrainAssets'
    def directory = layout.buildDirectory.dir('generated/trainAssets')
    outputs.dir(directory)
    doFirst { project.delete(directory) }
    args directory.get().asFile.absolutePath
}
tasks.named('processResources') { from(generateAssets) }

neoForge {
    mods {
        trainmod { sourceSet sourceSets.gameTest }
    }
}

tasks.named('processResources') {
    inputs.property 'modVersion', modVersion
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(modVersion: modVersion)
    }
    from('LICENSE')
    from('README.md') { rename { 'TRAINMOD-GUIDE.md' } }
}

tasks.named('jar') {
    zip64 = true
    manifest.attributes('Implementation-Version': modVersion)
    if (commit) {
        manifest.attributes('Git-Commit': commit)
    }
}
